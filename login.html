<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="./favicon/icons8-login-50.png" type="image/x-icon">
    <style>
        *{
            padding: 0px 10px;
            margin: auto;
            box-sizing: border-box;
        }
       body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
              background-image: url(./images/backg.png);
            background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
          

    
        }
        .main{
            border: 2px solid black;
            border-radius: 25px;
            width: 25%;
            height: 400px;
           
               background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(5px);

            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
             
        }

        .login {
            width: 350px;
            padding: 30px;
            
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bolder;
           
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: none;
        }

        .remember {
            margin-bottom: 15px;
           
        }

        .forget {
            float: right;
            
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        a{
            text-decoration: none;
            color: beige;
        }
a:hover{
   text-decoration: underline;
   font-weight: bold;
}
        .register {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
   
    <div class="main">
        <div class="login">
            <h1>Login</h1>
        </div>
        <div class="left">
            <input type="text" name="" id="" placeholder="Username">
            <input type="password" name="" id="" placeholder="Password">
            <input type="checkbox" name="rr" id="">
            <label for="rr">Remember me</label>
            <div class="forget">
            <a href="">Forget Password?</a>
            </div>
          <a href="./index.html"><button>Submit</button></a>
            <div class="register">
            <a href="">Don't have an account? Register</a>
            </div>
        </div>
       
            </div>
</body>
</html>
